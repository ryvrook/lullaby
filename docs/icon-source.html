<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;width:1024px;height:1024px;overflow:hidden}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27335f"/><stop offset="1" stop-color="#0f1a3c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde38c"/><stop offset="1" stop-color="#f2bf3d"/>
    </linearGradient>
    <linearGradient id="goldHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/><stop offset="1" stop-color="#f7cd55"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="190" ry="190" fill="url(#bg)"/>
  <!-- crescent: outer half circle r=340 about (540,512), inner arc about (740,512) r=sqrt(200^2+340^2) -->
  <path d="M 540 172
           A 340 340 0 0 0 540 852
           A 394.5 394.5 0 0 1 540 172 Z"
        fill="url(#gold)" stroke="#c8931c" stroke-width="30" stroke-linejoin="round"/>
  <!-- soft highlight along the outer edge -->
  <path d="M 344 278 A 305 305 0 0 0 344 746"
        fill="none" stroke="#fff4c4" stroke-width="16" stroke-opacity="0.55" stroke-linecap="round"/>
  <!-- sleeping marks on the moon body -->
  <g fill="#132047">
    <path d="M 262 420 h 92 v 26 l -54 66 h 56 v 26 h -96 v -26 l 54 -66 h -52 z"/>
    <path d="M 282 575 h 66 v 20 l -36 44 h 38 v 20 h -70 v -20 l 36 -44 h -34 z" opacity="0.9"/>
  </g>
  <!-- stars -->
  <g fill="url(#goldHi)" stroke="#c8931c" stroke-width="18" stroke-linejoin="round">
    <path d="M 730 290 l 28 70 l 70 28 l -70 28 l -28 70 l -28 -70 l -70 -28 l 70 -28 z"/>
    <path d="M 800 560 l 19 47 l 47 19 l -47 19 l -19 47 l -19 -47 l -47 -19 l 47 -19 z"/>
    <path d="M 640 720 l 14 36 l 36 14 l -36 14 l -14 36 l -14 -36 l -36 -14 l 36 -14 z"/>
  </g>
</svg></body></html>
